stages:
  - build
  - package
  - maintenance

variables:
  CUSTOM_DASHBOARD_IMAGE: $CI_REGISTRY_IMAGE/dashboard-ee

build-dashboard-artifacts:
  stage: build
  image:
    name: quay.io/kubermatic/build:go-1.25-node-22-kind-0.30-8
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - make build web-dist
  artifacts:
    paths:
      - modules/api/_build/
      - modules/web/_build/
      - modules/web/dist/
    expire_in: 1 day

package-dashboard-ee:
  stage: package
  image:
    name: cr.gitlab.switch.ch/kaas/docker-hub-mirror/martizih/kaniko:v1.24.1-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  needs:
    - job: build-dashboard-artifacts
      artifacts: true
  script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" \
        > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --cache=true \
        --destination "${CUSTOM_DASHBOARD_IMAGE}:${CI_COMMIT_TAG}"

rebase-dashboard-ee-fork:
  stage: maintenance
  image:
    name: cr.gitlab-int.switch.ch/sck/container-images/alpine/git:2.52.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  variables:
    GIT_STRATEGY: none
    TARGET_BRANCH: dashboard-ee-fork
    SOURCE_BRANCH: main
    DOCKER_AUTH_CONFIG: >-
      {"auths":{"cr.gitlab-int.switch.ch":{"username":"sck-container-images","password":"${CR_GITLAB_INT_REGISTRY_PASSWORD}"}}}
  script:
    - |
      if [ -z "${REBASE_PUSH_TOKEN}" ]; then
        echo "REBASE_PUSH_TOKEN is not set."
        exit 1
      fi
    - git config --global user.name "Dashboard CI - Rebase Bot"
    - git config --global user.email "dashboard-rebase-bot@${CI_SERVER_HOST}"
    - git init .
    - git remote add origin "https://dashboard-rebase-bot:${REBASE_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin "${TARGET_BRANCH}" "${SOURCE_BRANCH}"
    - git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
    - git rebase "origin/${SOURCE_BRANCH}"
    - git push origin "${TARGET_BRANCH}" --force
