stages:
  - build
  - package

variables:
  CUSTOM_DASHBOARD_IMAGE: $CI_REGISTRY_IMAGE/dashboard-ee

build-dashboard-artifacts:
  stage: build
  image:
    name: quay.io/kubermatic/build:go-1.25-node-22-kind-0.30-8
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - make build web-dist
  artifacts:
    paths:
      - modules/api/_build/
      - modules/web/_build/
      - modules/web/dist/
    expire_in: 1 day

package-dashboard-ee:
  stage: package
  image:
    name: cr.gitlab.switch.ch/kaas/docker-hub-mirror/martizih/kaniko:v1.24.1-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  needs:
    - job: build-dashboard-artifacts
      artifacts: true
  script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" \
        > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --cache=true \
        --destination "${CUSTOM_DASHBOARD_IMAGE}:${CI_COMMIT_TAG}"
